name: Build and integration tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: escala_test
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: escala_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U escala_test -d escala_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://escala_test:local-ci-password@127.0.0.1:5432/escala_tests
      TEST_REVIEW_DATABASE_URL: postgresql://escala_test:local-ci-password@127.0.0.1:5432/escala_tests_review
      TEST_ADAPTER_DATABASE_URL: postgresql://escala_test:local-ci-password@127.0.0.1:5432/escala_tests_adapter
      PGPASSWORD: local-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Create isolated databases
        run: |
          psql -h 127.0.0.1 -U escala_test -d escala_tests -c 'CREATE DATABASE escala_tests_review'
          psql -h 127.0.0.1 -U escala_test -d escala_tests -c 'CREATE DATABASE escala_tests_adapter'
      - run: npm run build
      - run: npm test
